name: Build RakuOS Hyprland Image

on:
  schedule:
    - cron: '0 17 * * 4'
  workflow_dispatch:
    inputs:
      base_image_tag:
        description: 'Base image tag'
        required: false
        default: 'staging'
      rakuos_staging:
        description: 'Enable staging (1 or 0)'
        required: false
        default: '1'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine build args
        id: build_args
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "base_image_tag=staging" >> $GITHUB_OUTPUT
            echo "rakuos_staging=1" >> $GITHUB_OUTPUT
            echo "image_tag=staging" >> $GITHUB_OUTPUT
          else
            echo "base_image_tag=${{ github.event.inputs.base_image_tag || 'staging' }}" >> $GITHUB_OUTPUT
            echo "rakuos_staging=${{ github.event.inputs.rakuos_staging || '1' }}" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          IMAGE_TAG=${{ steps.build_args.outputs.image_tag }}
          FULL_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          buildah build \
            --file Containerfile \
            --layers \
            --build-arg BASE_IMAGE_TAG=${{ steps.build_args.outputs.base_image_tag }} \
            --build-arg RAKUOS_STAGING=${{ steps.build_args.outputs.rakuos_staging }} \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.vendor=RakuOS" \
            --label "org.opencontainers.image.description=RakuOS Hyprland" \
            --label "containers.bootc=1" \
            --tag ${FULL_IMAGE}:${IMAGE_TAG} \
            --tag ${FULL_IMAGE}:${IMAGE_TAG}.${DATE_TAG} \
            .

          buildah push --compression-format zstd:chunked ${FULL_IMAGE}:${IMAGE_TAG}
          buildah push --compression-format zstd:chunked ${FULL_IMAGE}:${IMAGE_TAG}.${DATE_TAG}

name: Build RakuOS Hyprland Image

on:
  workflow_dispatch:
    inputs:
      base_image_tag:
        description: 'Base image tag (staging, latest)'
        required: false
        default: 'staging'
      rakuos_staging:
        description: 'Enable staging (1 or 0)'
        required: false
        default: '1'

  schedule:
    - cron: '0 17 */2 * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/tofan79/hyprland-rakuos-nvidia-v3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f Containerfile \
            --build-arg BASE_IMAGE_TAG=${{ github.event.inputs.base_image_tag || 'staging' }} \
            --build-arg RAKUOS_STAGING=${{ github.event.inputs.rakuos_staging || '1' }} \
            --label 'org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)' \
            --label 'org.opencontainers.image.source=https://github.com/${{ github.repository }}' \
            --label 'org.opencontainers.image.revision=${{ github.sha }}' \
            --label 'org.opencontainers.image.vendor=RakuOS' \
            --label 'org.opencontainers.image.description=RakuOS Hyprland' \
            -t ghcr.io/${{ env.IMAGE_NAME }}:latest \
            -t ghcr.io/${{ env.IMAGE_NAME }}:$(date -u +%Y%m%d) \
            --push \
            .

      - name: Image digest
        run: |
          echo "Built ghcr.io/${{ env.IMAGE_NAME }}:latest"

      - name: Cleanup old container versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEEP_COUNT=3
          echo "Fetching container versions..."
          VERSIONS=$(gh api /user/packages/container/hyprland-rakuos/versions --paginate -q '.[].id')
          COUNT=$(echo "$VERSIONS" | wc -l)
          echo "Total versions: $COUNT"
          
          if [ "$COUNT" -le "$KEEP_COUNT" ]; then
            echo "Versions ($COUNT) <= keep count ($KEEP_COUNT), skipping cleanup"
            exit 0
          fi
          
          echo "Keeping latest $KEEP_COUNT versions, deleting older ones..."
          DELETE_IDS=$(echo "$VERSIONS" | tail -n +$((KEEP_COUNT + 1)))
          for id in $DELETE_IDS; do
            echo "Deleting version $id..."
            gh api -X DELETE /user/packages/container/hyprland-rakuos/versions/$id
          done
          echo "Cleanup complete"

name: Build RakuOS Hyprland Image

on:
  workflow_dispatch:
    inputs:
      base_image_tag:
        description: 'Base image tag (staging, latest)'
        required: false
        default: 'staging'
      rakuos_staging:
        description: 'Enable staging (1 or 0)'
        required: false
        default: '1'

  schedule:
    - cron: '0 17 */3 * *'

env:
  REGISTRY: quay.io
  IMAGE_NAME: quay.io/mindset404/hyprland-atomic

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USER }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f Containerfile \
            --build-arg BASE_IMAGE_TAG=${{ github.event.inputs.base_image_tag || 'staging' }} \
            --build-arg RAKUOS_STAGING=${{ github.event.inputs.rakuos_staging || '1' }} \
            --label 'org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)' \
            --label 'org.opencontainers.image.source=https://github.com/${{ github.repository }}' \
            --label 'org.opencontainers.image.revision=${{ github.sha }}' \
            --label 'org.opencontainers.image.vendor=RakuOS' \
            --label 'org.opencontainers.image.description=RakuOS Hyprland' \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:$(date -u +%Y%m%d) \
            --push \
            .

      - name: Image digest
        run: |
          echo "Built ${{ env.IMAGE_NAME }}:latest"

      - name: Cleanup old Quay tags
        env:
          QUAY_USER: ${{ secrets.QUAY_ROBOT_USER }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
          KEEP_COUNT: 5
        run: |
          REPO="mindset404/hyprland-atomic"
          echo "Fetching tags on quay.io/$REPO..."
          TAGS=$(curl -sS -u "$QUAY_USER:$QUAY_TOKEN" \
            "https://quay.io/api/v1/repository/$REPO/tag/?onlyActiveTags=true&limit=100" \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print("\n".join(t["name"] for t in d.get("tags",[])))')
          echo "All tags:"
          echo "$TAGS"
          # Only consider date tags we manage (e.g. 20260908); never touch latest
          DATE_TAGS=$(echo "$TAGS" | grep -E '^[0-9]{8}$' | sort -r)
          COUNT=$(echo "$DATE_TAGS" | grep -c . || true)
          echo "Date tags found: $COUNT"
          if [ "$COUNT" -le "$KEEP_COUNT" ]; then
            echo "Date tags ($COUNT) <= keep count ($KEEP_COUNT), skipping cleanup"
            exit 0
          fi
          echo "Keeping latest $KEEP_COUNT date tags, deleting older ones..."
          echo "$DATE_TAGS" | tail -n +$((KEEP_COUNT + 1)) | while read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Deleting tag $TAG..."
            curl -sS -X DELETE -u "$QUAY_USER:$QUAY_TOKEN" \
              "https://quay.io/api/v1/repository/$REPO/tag/$TAG" -o /dev/null || true
          done
          echo "Cleanup complete"
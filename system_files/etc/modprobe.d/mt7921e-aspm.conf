# MediaTek MT7921 (Filogic 330) driver hang workaround.
#
# Symptom (ASUS G735ZC, 14c3:7961): WiFi drops, system unresponsive, reboot
# hang requiring hard reset. Journal repeats "driver own failed" /
# "Timeout for driver own" / "chip reset failed" (~3 minutes after boot).
# This matches known upstream bugs (kernel.org bugzilla #215391, #220353).
#
# Disabling PCIe ASPM on this driver avoids the broken power-state transition.
# "disable_aspm" is an official MediaTek module parameter
# (module_param_named(disable_aspm, mt7921_disable_aspm, bool, 0644)).
options mt7921e disable_aspm=1
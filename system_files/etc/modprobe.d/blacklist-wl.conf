# This ASUS TUF A15 (FA506ICB) has no Broadcom wireless hardware: wifi is a
# MediaTek MT7921 (mt7921e) and LAN is Realtek r8169. The base image ships
# broadcom-wl kmod which loads whenever present, polluting lsmod and tainting
# the kernel for nothing. Block it for this device.
#
# ► Other devices (with Broadcom wireless): DELETE this file.
blacklist wl
symbol = " "
[zig]
format = '[─](fg:current_line)[](fg:orange)[$symbol](fg:primary bg:orange)[](fg:orange bg:box)[ $version](fg:foreground bg:box)[](fg:box)'
symbol = " "
[git_status]
format = '$all_status'
style = 'bold blue'
conflicted = '󰘠 '
untracked = '󰐸 '
ahead = '󰚤${count} '
behind = '󰚥${count} '
diverged = '󰚤${ahead_count}󰚥${behind_count} '
up_to_date = '✓ '
renamed = '󰐎 '
deleted = '󰐈 '
modified = '󰁽 '
staged = '󰘑 '

[package]
format = '[─](fg:current_line)[](fg:purple)[$symbol](fg:primary bg:purple)[](fg:purple bg:box)[ $version](fg:foreground bg:box)[](fg:box)'
display_private = false
symbol = "󰏗 "

[fill]
symbol = '─'
style = 'fg:current_line'

[shell]
format = '[─](fg:current_line)[](fg:blue)[ ](fg:primary bg:blue)[](fg:blue bg:box)[ $indicator](fg:foreground bg:box)[](fg:box)'
unknown_indicator = 'shell'
powershell_indicator = 'powershell'
fish_indicator = 'fish'
disabled = false

[username]
format = '[─](fg:current_line)[](fg:yellow)[ ](fg:primary bg:yellow)[](fg:yellow bg:box)[ $user](fg:foreground bg:box)[](fg:box) '
show_always = true

[character]
format = """
[╰─$symbol](fg:current_line) """
success_symbol = '[λ](fg:bold white)'
error_symbol = '[×](fg:bold red)'
# Keep Wi-Fi power save off at the NetworkManager level.
#
# Broken WiFi firmware (MediaTek MT7921 here; Intel BE200/BE211 elsewhere)
# can drop the link outright when the radio naps. "wifi.powersave = 2"
# disables power save; same approach Omarchy ships. Complements (and is
# orthogonal to) the mt7921e PCIe ASPM workaround in /etc/modprobe.d/.
[connection]
wifi.powersave = 2
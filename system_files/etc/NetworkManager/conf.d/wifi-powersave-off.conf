# MT7921 firmware is prone to hang ("driver own failed / Timeout for driver
# own / Message ... timeout / chip reset failed") during runtime power-state
# transitions and teardown, which can stall shutdown and cause dropped wifi.
# Disabling 802.11 power save (2) is the standard mitigation for MT7921.
# Trade-off: slightly higher wifi power draw.
[connection]
wifi.powersave = 2
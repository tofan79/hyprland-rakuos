# The luminous tray daemon was removed from the XDG autostart of this device
# (rakuos-software-qt runs on demand, tray stays off). A plain rm during the
# image build is not enough: rpm-ostree re-instates /etc files that are still
# owned by the installing RPM on every upgrade (3-way merge via rpmdb). Remove
# the file at each boot instead so the setting survives upgrades.
r! /etc/xdg/autostart/rakuos-software-tray.desktop
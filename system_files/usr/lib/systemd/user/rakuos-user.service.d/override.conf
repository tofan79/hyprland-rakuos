# rakuos-user (rakuos-core) rsyncs greeter themes into
# /var/lib/noctalia-greeter/.themes/* but that directory is never pre-created,
# so every boot rsync fails with "mkdir ... No such file or directory".
# Pre-create it before the sync runs.
[Service]
ExecStartPre=mkdir -p /var/lib/noctalia-greeter/.themes
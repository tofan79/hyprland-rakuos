# Mirror of the nvidia-persistenced override: on this hybrid laptop the nvidia
# module loads and /dev/nvidia* nodes appear only when greetd/display-manager
# starts. The stock ConditionPathExistsGlob=/dev/nvidia* is evaluated BEFORE the
# nodes exist, so the condition fails, the service is permanently skipped every
# boot and nvidia-powerd (dynamic boost for the RTX 3050 dGPU) never runs.
#
# Condition failures are NOT restartable, hence the need to drop the condition
# and instead poll for the node in ExecStartPre with a bounded timeout — the
# unit still starts in parallel and only blocks itself until the node exists
# (never stalls boot greeting, same rationale as nvidia-persistenced).
[Unit]
ConditionPathExistsGlob=

[Service]
ExecStartPre=/bin/sh -c 'i=0; until [ -e /dev/nvidia0 ] || [ "$i" -ge 60 ]; do sleep 1; i=$((i+1)); done'
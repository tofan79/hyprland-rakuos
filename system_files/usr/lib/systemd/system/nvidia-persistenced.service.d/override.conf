# nvidia module loads and /dev/nvidia* nodes are created at the same moment
# greetd/display-manager starts; the stock ConditionPathExistsGlob is evaluated
# BEFORE the nodes appear, so the service is skipped every boot even though the
# GPU works.
#
# Do NOT wait on the dev-nvidia0.device unit: nvidia's char devices are created
# by the module itself and udev never activates that unit, so systemd would sit
# on the device job until its 45s timeout and stall the whole boot greeting.
# Instead, poll for the node in ExecStartPre with a bounded timeout. The unit
# starts in parallel and only blocks itself until the node exists.
[Unit]
ConditionPathExistsGlob=

[Service]
ExecStartPre=/bin/sh -c 'i=0; until [ -e /dev/nvidia0 ] || [ "$i" -ge 60 ]; do sleep 1; i=$((i+1)); done'
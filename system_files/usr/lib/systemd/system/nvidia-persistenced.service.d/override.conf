# nvidia module loads and /dev/nvidia* nodes are created at the same moment
# greetd/display-manager starts; the stock ConditionPathExistsGlob is evaluated
# BEFORE the nodes appear, so the service is skipped every boot even though the
# GPU works. Instead of checking the glob, wait for the nvidia0 device node to
# appear via a device unit dependency, then start persistenced after it.
[Unit]
ConditionPathExistsGlob=
Wants=dev-nvidia0.device
After=dev-nvidia0.device